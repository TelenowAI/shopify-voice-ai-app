# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "1181346b04d8d62d945cce9aa5fa90d7"
name = "telenowvoiceai"
application_url = "https://shop.telenow.ai"
embedded = true

[build]
automatically_update_urls_on_dev = false

[events]
api_version = "unstable"

  [[events.subscription]]
  handle = "order-created"
  topic = "Order"
  actions = [ "create" ]
  uri = "https://shop.telenow.ai/events/orders"
  api_version = "unstable"

[webhooks]
api_version = "2026-07"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_checkouts,read_customers,read_fulfillments,read_orders,write_orders"

[auth]
redirect_urls = [ "https://shop.telenow.ai/auth/callback" ]
