name = "telenowvoiceai"
client_id = "5aef351a70518eb6484369ba20f78ecc"

application_url = "https://shopify.telenow.ai"

embedded = true

[access_scopes]
scopes = "read_orders,write_orders,read_customers,read_checkouts,read_fulfillments"

use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://shopify.telenow.ai/auth/callback"
]

[webhooks]
api_version = "2026-07"

[build]
# false, not true: with `true` the CLI silently rewrites application_url and
# [auth].redirect_urls above to the temporary tunnel URL on every
# `shopify app dev` run — which is how those two ended up pointing at a dead
# address and OAuth stopped working. Keep production URLs in this file and use a
# separate app record for dev (`shopify app config link --config=dev`).
automatically_update_urls_on_dev = false