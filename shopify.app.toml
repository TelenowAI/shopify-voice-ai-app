# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5aef351a70518eb6484369ba20f78ecc"
name = "telenowvoiceai"
application_url = "https://shop.telenow.ai"
embedded = true

[events]
api_version = "unstable"

  [[events.subscription]]
  handle = "order-created"
  topic = "Order"
  actions = [ "create" ]
  uri = "https://shop.telenow.ai/events/orders"
  api_version = "unstable"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_checkouts,read_customers,read_fulfillments,read_orders,write_orders"

[auth]
redirect_urls = [ "https://shop.telenow.ai/auth/callback" ]

[webhooks]
api_version = "2026-07"

  # Mandatory GDPR topics. The review check reads these from the deployed app
  # config — registering topics at runtime is not visible to it. Format per
  # shopify.dev/docs/apps/build/compliance/privacy-law-compliance.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://shop.telenow.ai/webhooks/shopify"

[build]
# false, not true: with true the CLI silently rewrites application_url and
# [auth].redirect_urls above to the temporary tunnel URL on every shopify app dev
# run - which would re-break OAuth right after the domain move.
automatically_update_urls_on_dev = false
