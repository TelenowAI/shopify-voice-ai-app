# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

# ─────────────────────────────────────────────────────────────────────────────
# client_id MUST stay identical in this file and in shopify.app.telenowvoiceai.toml.
#
# There are two Partner apps with the name "telenowvoiceai". Only
# 1181346b04d8d62d945cce9aa5fa90d7 is the one that is listed and under review;
# 5aef351a70518eb6484369ba20f78ecc is an unlisted duplicate created by an early
# `shopify app init`. This file is the CLI *default* config — the one a bare
# `shopify app deploy` uses when nobody remembers to run
# `shopify app config use telenowvoiceai` first. While it named the duplicate,
# that deploy silently published to an app no reviewer can see: the work landed,
# the listing did not change, and the failure looked exactly like the work not
# working.
#
# With the Billing API in play this is no longer merely confusing, it is fatal.
# An access token is issued by one app, and `currentAppInstallation.
# activeSubscriptions` is scoped to the app that issued it. Serve the app with
# credentials from one client_id while the merchant's subscription was created
# under the other and the entitlement read returns an empty array for every
# paying merchant — the app then locks its own customers out of the product they
# just paid for, with no error anywhere to explain why.
#
# So: if you ever change the client_id, change it in BOTH toml files in the same
# commit, and change SHOPIFY_API_KEY / SHOPIFY_API_SECRET in the deployed
# environment to match (see DEPLOY.md). Never let the two files disagree.
# ─────────────────────────────────────────────────────────────────────────────
client_id = "1181346b04d8d62d945cce9aa5fa90d7"
name = "telenowvoiceai"
application_url = "https://shop.telenow.ai"
embedded = true

[events]
api_version = "unstable"

  [[events.subscription]]
  handle = "order-created"
  topic = "Order"
  actions = [ "create" ]
  uri = "https://shop.telenow.ai/events/orders"
  api_version = "unstable"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_checkouts,read_customers,read_fulfillments,read_orders,write_orders"

[auth]
redirect_urls = [ "https://shop.telenow.ai/auth/callback" ]

[webhooks]
api_version = "2026-07"

  # Mandatory GDPR topics. The review check reads these from the deployed app
  # config — registering topics at runtime is not visible to it. Format per
  # shopify.dev/docs/apps/build/compliance/privacy-law-compliance.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://shop.telenow.ai/webhooks/shopify"

[build]
# false, not true: with true the CLI silently rewrites application_url and
# [auth].redirect_urls above to the temporary tunnel URL on every shopify app dev
# run - which would re-break OAuth right after the domain move.
automatically_update_urls_on_dev = false
