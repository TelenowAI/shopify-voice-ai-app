# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5aef351a70518eb6484369ba20f78ecc"
name = "telenowvoiceai"
application_url = "https://shop.telenow.ai"
embedded = true

[events]
api_version = "unstable"

  [[events.subscription]]
  handle = "order-created"
  topic = "Order"
  actions = [ "create" ]
  uri = "https://shop.telenow.ai/events/orders"
  api_version = "unstable"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_checkouts,read_customers,read_fulfillments,read_orders,write_orders"

[auth]
redirect_urls = [ "https://shop.telenow.ai/auth/callback" ]

[webhooks]
api_version = "2026-07"

  # Shopify's automated review posts to these three URLs directly, so they
  # must be declared here — registering the topics at runtime is not visible
  # to the check.
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://shop.telenow.ai/webhooks/shopify"
  customer_deletion_url = "https://shop.telenow.ai/webhooks/shopify"
  shop_deletion_url = "https://shop.telenow.ai/webhooks/shopify"

[build]
automatically_update_urls_on_dev = true
