<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Talk to your agent — Telenow</title>
<style>
  :root {
    --bg: #ffffff; --card: #ffffff; --line: #e3e6ec; --text: #1a1c23;
    --muted: #6b7280; --accent: #1f2b57; --accent-text: #ffffff;
    --ok: #16a34a; --err: #dc2626; --soft: #f6f7f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --line: #262b35; --text: #e7eaf0;
      --muted: #9aa3b2; --accent: #6c5ce7; --accent-text: #ffffff; --soft: #1d212a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
  }
  .wrap { width: 100%; max-width: 440px; text-align: center; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 22px; font-size: 13px; }
  .orb {
    width: 116px; height: 116px; border-radius: 50%; margin: 0 auto 18px;
    background: var(--soft); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; transition: transform .1s ease, box-shadow .15s ease;
  }
  .orb.live { border-color: var(--accent); }
  .status { font-weight: 600; margin-bottom: 4px; }
  .detail { color: var(--muted); font-size: 12.5px; min-height: 34px; margin-bottom: 18px; }
  button {
    font: inherit; font-weight: 600; border-radius: 9px; padding: 11px 22px;
    border: 1px solid var(--line); cursor: pointer; background: var(--card); color: var(--text);
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { background: var(--err); color: #fff; border-color: var(--err); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .row { display: flex; gap: 10px; justify-content: center; }
  .err {
    background: color-mix(in srgb, var(--err) 12%, transparent);
    border: 1px solid var(--err); color: var(--err);
    border-radius: 9px; padding: 10px 12px; font-size: 13px;
    margin-bottom: 16px; text-align: left;
  }
  .meter { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 0 auto 18px; width: 160px; }
  .meter i { display: block; height: 100%; width: 0%; background: var(--ok); transition: width .08s linear; }
</style>

<div class="wrap">
  <div class="orb" id="orb">🎙</div>
  <h1 id="title">Talk to your agent</h1>
  <p class="sub" id="sub">Telenow web call</p>
  <div class="meter"><i id="meter"></i></div>
  <div class="status" id="status">Ready</div>
  <div class="detail" id="detail">Click Start to allow your microphone and begin.</div>
  <div id="errBox"></div>
  <div class="row">
    <button class="primary" id="startBtn">Start call</button>
    <button class="danger" id="hangBtn" style="display:none;">Hang up</button>
  </div>
</div>

<script type="module">
  // ───────────────────────────────────────────────────────────────────────────
  // Browser call client. The opener already minted the session through the
  // Shopify app's server, so this page only needs to move audio.
  //
  // Wire protocol (mirrors the Telenow dashboard widget):
  //   -> { event: 'start',  sessionId }
  //   -> { event: 'media',  data: <b64>, format: 'pcm16', sampleRate: 16000 }
  //   <- { event: 'media',  data: <b64>, format?: 'mulaw'|'pcm16', sampleRate?: 8000 }
  //   <- { event: 'clear' }            barge-in: drop everything queued
  //   <- { event: 'gain',  value }     duck/restore the agent's volume
  //
  // Note the asymmetric defaults: we always SEND 16 kHz linear PCM16, but an
  // inbound frame with no format/sampleRate is 8 kHz mulaw — that is what the
  // dashboard assumes and the backend still emits for carrier-shaped audio.
  // ───────────────────────────────────────────────────────────────────────────

  const TARGET_RATE = 16000;   // STT wire rate
  const FRAME_MS = 20;
  const SAMPLES_PER_FRAME = (TARGET_RATE * FRAME_MS) / 1000; // 320

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.hash.slice(1));
  const sessionId = params.get('s') || '';
  const wsUrl = params.get('u') || '';
  const agentName = params.get('n') || '';
  // Drop the fragment so the session id is not left sitting in the address bar.
  history.replaceState(null, '', location.pathname);

  if (agentName) { $('title').textContent = agentName; $('sub').textContent = 'Telenow web call'; }

  let ws = null, audioCtx = null, micStream = null, micNode = null, srcNode = null;
  let playCursor = 0, live = false, duckGain = null;
  let outBuf = [];               // Float32 chunks pending resample+send
  const scheduled = new Set();   // AudioBufferSourceNodes we can still cancel

  function setStatus(s, d) { $('status').textContent = s; if (d !== undefined) $('detail').textContent = d; }
  function showErr(msg) { $('errBox').innerHTML = '<div class="err"></div>'; $('errBox').firstChild.textContent = msg; }
  function clearErr() { $('errBox').innerHTML = ''; }

  // ── codecs ────────────────────────────────────────────────────────────────
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64(bytes) {
    let s = '';
    // Chunked: String.fromCharCode blows the arg limit on a large frame.
    for (let i = 0; i < bytes.length; i += 0x8000) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(s);
  }
  /** G.711 mu-law byte -> signed 16-bit sample. */
  function mulawToPcm16(bytes) {
    const out = new Int16Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) {
      let u = ~bytes[i] & 0xff;
      const sign = u & 0x80;
      const exp = (u >> 4) & 0x07;
      const mant = u & 0x0f;
      let mag = ((mant << 3) + 0x84) << exp;
      mag -= 0x84;
      out[i] = sign ? -mag : mag;
    }
    return out;
  }
  function bytesToPcm16LE(bytes) {
    const n = bytes.length >> 1;
    const out = new Int16Array(n);
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    for (let i = 0; i < n; i++) out[i] = dv.getInt16(i * 2, true);
    return out;
  }

  // ── mic capture worklet (audio thread, so UI jank cannot drop frames) ──────
  const CAPTURE_SRC = `
    class TnCapture extends AudioWorkletProcessor {
      process(inputs) {
        const i = inputs[0];
        if (i && i[0]) this.port.postMessage(i[0].slice(0));
        return true;
      }
    }
    registerProcessor('tn-capture', TnCapture);
  `;

  /**
   * Downsample ctx rate (usually 48 kHz) to 16 kHz. Averaging across each
   * source window acts as a crude low-pass; plain index-picking would alias
   * every consonant above 8 kHz straight back into the speech band.
   */
  function resampleTo(src, fromRate, toRate) {
    if (fromRate === toRate) return src;
    const ratio = fromRate / toRate;
    const n = Math.floor(src.length / ratio);
    const out = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const start = i * ratio;
      const end = Math.min(start + ratio, src.length);
      let sum = 0, c = 0;
      for (let j = Math.floor(start); j < end; j++) { sum += src[j]; c++; }
      out[i] = c ? sum / c : 0;
    }
    return out;
  }

  function onMicChunk(chunk) {
    if (!live) return;
    // Level meter — cheap RMS over the raw chunk.
    let peak = 0;
    for (let i = 0; i < chunk.length; i++) { const a = Math.abs(chunk[i]); if (a > peak) peak = a; }
    $('meter').style.width = Math.min(100, Math.round(peak * 180)) + '%';

    outBuf.push(resampleTo(chunk, audioCtx.sampleRate, TARGET_RATE));

    let total = outBuf.reduce((n, c) => n + c.length, 0);
    while (total >= SAMPLES_PER_FRAME) {
      const merged = new Float32Array(total);
      let o = 0;
      for (const c of outBuf) { merged.set(c, o); o += c.length; }
      const frame = merged.subarray(0, SAMPLES_PER_FRAME);
      const pcm = new Int16Array(SAMPLES_PER_FRAME);
      for (let i = 0; i < SAMPLES_PER_FRAME; i++) {
        const s = Math.max(-1, Math.min(1, frame[i]));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          event: 'media',
          data: bytesToB64(new Uint8Array(pcm.buffer)),
          format: 'pcm16',
          sampleRate: TARGET_RATE,
        }));
      }
      const rest = merged.subarray(SAMPLES_PER_FRAME);
      outBuf = rest.length ? [new Float32Array(rest)] : [];
      total = rest.length;
    }
  }

  // ── playback ──────────────────────────────────────────────────────────────
  function playFrame(b64, format, rate) {
    if (!audioCtx) return;
    const bytes = b64ToBytes(b64);
    const pcm = format === 'pcm16' ? bytesToPcm16LE(bytes) : mulawToPcm16(bytes);
    const f32 = new Float32Array(pcm.length);
    for (let i = 0; i < pcm.length; i++) f32[i] = pcm[i] / 32768;

    const up = resampleUp(f32, rate, audioCtx.sampleRate);
    const buf = audioCtx.createBuffer(1, up.length, audioCtx.sampleRate);
    buf.copyToChannel(up, 0);

    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(duckGain);
    // Queue ahead so consecutive TTS frames play gap-free rather than racing
    // the clock; rebase if we have fallen behind.
    const now = audioCtx.currentTime;
    if (playCursor < now + 0.02) playCursor = now + 0.05;
    src.start(playCursor);
    playCursor += buf.duration;
    scheduled.add(src);
    src.onended = () => scheduled.delete(src);
  }

  /** Linear interpolation upsample (8/16 kHz -> context rate). */
  function resampleUp(src, fromRate, toRate) {
    if (fromRate === toRate) return src;
    const ratio = toRate / fromRate;
    const n = Math.floor(src.length * ratio);
    const out = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const pos = i / ratio;
      const i0 = Math.floor(pos);
      const i1 = Math.min(i0 + 1, src.length - 1);
      const t = pos - i0;
      out[i] = src[i0] * (1 - t) + src[i1] * t;
    }
    return out;
  }

  function stopPlayback() {
    for (const s of scheduled) { try { s.stop(); } catch {} }
    scheduled.clear();
    playCursor = audioCtx ? audioCtx.currentTime : 0;
  }

  // ── call lifecycle ────────────────────────────────────────────────────────
  async function start() {
    clearErr();
    if (!sessionId || !wsUrl) {
      showErr('Missing session details. Close this window and start the call again from the app.');
      return;
    }
    $('startBtn').disabled = true;
    setStatus('Connecting…', 'Requesting microphone access.');

    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
    } catch (err) {
      $('startBtn').disabled = false;
      setStatus('Ready', 'Click Start to allow your microphone and begin.');
      showErr(err && err.name === 'NotAllowedError'
        ? 'Microphone permission was denied. Allow it in your browser, then click Start again.'
        : 'Could not access the microphone: ' + (err && err.message ? err.message : String(err)));
      return;
    }

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    duckGain = audioCtx.createGain();
    duckGain.connect(audioCtx.destination);
    playCursor = audioCtx.currentTime;

    const blobUrl = URL.createObjectURL(new Blob([CAPTURE_SRC], { type: 'application/javascript' }));
    try { await audioCtx.audioWorklet.addModule(blobUrl); } finally { URL.revokeObjectURL(blobUrl); }

    srcNode = audioCtx.createMediaStreamSource(micStream);
    micNode = new AudioWorkletNode(audioCtx, 'tn-capture');
    micNode.port.onmessage = (e) => onMicChunk(e.data);
    srcNode.connect(micNode);
    // The worklet emits no output, but Chrome will not pull from a node that
    // reaches no destination — route it through a muted gain to keep it running.
    const sink = audioCtx.createGain();
    sink.gain.value = 0;
    micNode.connect(sink).connect(audioCtx.destination);

    setStatus('Connecting…', 'Opening the audio channel.');
    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      ws.send(JSON.stringify({ event: 'start', sessionId }));
      live = true;
      $('orb').classList.add('live');
      $('hangBtn').style.display = '';
      $('startBtn').style.display = 'none';
      setStatus('Live', 'Say hello — the agent is listening.');
    };

    ws.onmessage = (evt) => {
      let m;
      try { m = JSON.parse(evt.data); } catch { return; }
      if (m.event === 'media' && m.data) {
        // Inbound defaults differ from what we send: no format means mulaw@8k.
        playFrame(m.data, m.format || 'mulaw', m.sampleRate || 8000);
      } else if (m.event === 'clear') {
        stopPlayback();
        if (duckGain) duckGain.gain.value = 1;
      } else if (m.event === 'gain') {
        const v = Number(m.value);
        if (duckGain && !Number.isNaN(v)) duckGain.gain.value = Math.max(0, Math.min(1.1, v));
      } else if (m.event === 'stop' || m.event === 'end') {
        setStatus('Call ended', 'The agent hung up.');
        teardown();
      }
    };

    ws.onerror = () => showErr('The audio connection failed. Close this window and try again.');
    ws.onclose = () => {
      if (live) { setStatus('Call ended', 'The connection closed.'); teardown(); }
    };
  }

  function teardown() {
    live = false;
    $('orb').classList.remove('live');
    $('meter').style.width = '0%';
    try { stopPlayback(); } catch {}
    try { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ event: 'stop' })); } catch {}
    try { ws && ws.close(); } catch {}
    try { micNode && micNode.disconnect(); srcNode && srcNode.disconnect(); } catch {}
    try { micStream && micStream.getTracks().forEach((t) => t.stop()); } catch {}
    try { audioCtx && audioCtx.close(); } catch {}
    ws = null; audioCtx = null; micStream = null; micNode = null; srcNode = null;
    $('hangBtn').style.display = 'none';
    $('startBtn').style.display = '';
    $('startBtn').disabled = false;
    $('startBtn').textContent = 'Call again';
  }

  $('startBtn').addEventListener('click', start);
  $('hangBtn').addEventListener('click', () => { setStatus('Call ended', 'You hung up.'); teardown(); });
  // Never leave the mic hot if the window is closed mid-call.
  window.addEventListener('beforeunload', () => { if (live) teardown(); });
</script>
